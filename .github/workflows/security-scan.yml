name: Security scan

# Dependency + secret hygiene on every push/PR touching code, plus a
# weekly run so newly-published CVEs surface even without commits.
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/security-scan.yml"]
  pull_request:
    paths: ["backend/**", "frontend/**"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Production deps only; fail on high/critical.
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  backend-audit:
    name: pip-audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # scrapegraphai needs >=3.12
      - run: pip install pip-audit
      # NOTE: markdownify CVE-2025-46656 will appear in this report — it is a
      # documented, contained accepted risk (python-jobspy hard-pins the old
      # version; scraping runs in an isolated Cloud Run job, never the API).
      # See the note in backend/requirements.txt. Everything ELSE in the
      # report is actionable — review the job output on every run.
      - run: pip-audit -r backend/requirements.txt
        continue-on-error: true

  secret-scan:
    name: gitleaks (committed secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
