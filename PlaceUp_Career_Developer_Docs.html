function Blk({type="info",children}){

function Code({lines,lang,maxH}){
  const [copied,setCopied]=useState(false);
  const doCopy=()=>{navigator.clipboard?.writeText(lines.join("\n"));setCopied(true);setTimeout(()=>setCopied(false),2000);};
  const lineColor=(l)=>{
    const t=l.trim();
    if(t.startsWith("#")||t.startsWith("//")||t.startsWith("--")||t.startsWith("/*")) return "#4a7060";
    if(t.startsWith("import")||t.startsWith("export")||t.startsWith("const")||t.startsWith("function")||t.startsWith("class")||t.startsWith("async")||t.startsWith("return")) return P.gold2;
    if(t.startsWith("CREATE")||t.startsWith("SELECT")||t.startsWith("INSERT")||t.startsWith("ALTER")||t.startsWith("DROP")||t.startsWith("INDEX")) return P.blue2;
    if(t.includes(":")||t.includes("=>")) return "#A8D8C8";
    return "#C8E0D8";
  };
  return(
    <div style={{background:"#030C18",border:"1px solid rgba(212,168,67,0.13)",borderRadius:10,overflow:"hidden",margin:"10px 0"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 14px",borderBottom:"1px solid rgba(255,255,255,0.04)",background:"rgba(255,255,255,0.02)"}}>
        <span style={{fontSize:10,color:P.muted,letterSpacing:".7px",textTransform:"uppercase"}}>{lang||"code"}</span>
        <button onClick={doCopy} style={{background:"none",border:"none",cursor:"pointer",fontSize:11,color:copied?P.teal:P.muted}}>{copied?"✓ Copied":"Copy"}</button>
      </div>
      <pre style={{margin:0,padding:"14px 18px",overflowX:"auto",maxHeight:maxH||"none"}}>
        {lines.map((l,i)=><div key={i} style={{fontSize:12.5,lineHeight:1.9,color:lineColor(l),whiteSpace:"pre"}}>{l||" "}</div>)}
      </pre>
    </div>
  );
}

function KV({rows}){

}

function Classifier2(){
  return <div>
    <SH n="07">Visa Classification Engine</SH>
    <P2>Every fetched job runs through a 3-step classification engine. Output: boolean flags + confidence score (0–100) + visa tags stored in PostgreSQL.</P2>
    <H3>Keyword Scoring Matrix</H3>
    <DT headers={["Visa","Score","Positive Keywords","Negative Override"]} rows={[
      ["OPT","+30","opt, cpt, f-1, f1 visa, student visa, international students ok","Score drops to 0 if negative keywords found"],
      ["STEM OPT","+40","stem opt, 24 month extension, stem extension, e-verify","STEM categories only: tech, data, healthcare, eng"],
      ["H-1B","+50","h-1b sponsor, h1b, will sponsor, visa sponsorship, work authorization","Must reach ≥60 total for h1b flag"],
      ["Any Visa","+20","visa friendly, all work authorizations, no restriction","Boosts borderline cases"],
      ["Negative","−30","no sponsorship, us citizens only, no visa, gc only, permanent resident only","Sets discard=true if score <10"],
    ]}/>
    <H3>Classification Code</H3>
    <Code lang="javascript — classifier.js" lines={[
      "const STEM_CATS = ['technology','data','healthcare','engineering'];",
      "",
      "export function classifyJob(job, uscisMatch) {",
      "  let score = 0;",
      "  const txt = `${job.title} ${job.description}`.toLowerCase();",
      "",
      "  // OPT signals",
      "  if (/\\bopt\\b|cpt|f-1|student visa|international students/i.test(txt)) score += 30;",
      "  // STEM OPT signals",
      "  if (/stem opt|24.month|stem extension|e-verify/i.test(txt)) score += 40;",
      "  // H-1B signals",
      "  if (/h-?1b|visa sponsor|will sponsor|work auth/i.test(txt)) score += 50;",
      "  // Positive generic",
      "  if (/visa friendly|all work auth|no restriction/i.test(txt)) score += 20;",
      "  // Negative signals",
      "  if (/no sponsor|citizens only|gc only|perm.?resident only/i.test(txt)) score -= 30;",
      "",
      "  // USCIS cross-reference bonus",
      "  if (uscisMatch?.petition_count >= 5)  { score += 30; }",
      "  if (uscisMatch?.petition_count >= 50) { score += 20; }",
      "",
      "  const isStem = STEM_CATS.includes(job.category);",
      "  return {",
      "    visa_opt:       score >= 40,",
      "    visa_stem_opt:  score >= 50 && isStem,",
      "    visa_h1b:       score >= 60,",
      "    h1b_verified:   !!uscisMatch?.petition_count && uscisMatch.petition_count >= 5,",
      "    visa_score:     Math.min(100, Math.max(0, score)),",
      "    discard:        score < 10,",
      "  };",
      "}",
    ]}/>
  </div>;
}

    <H3>Complete Fetcher Script</H3>
    <Code lang="javascript — src/fetcher/index.js" lines={[
      "import { QUERIES }             from './queries.js';    // all 42+ query strings",
      "import { fetchJSearch }        from './sources/jsearch.js';",
      "import { fetchUSAJobs }        from './sources/usajobs.js';",
      "import { fetchIdealist }       from './sources/idealist.js';",
      "import { classifyJob }         from '../classifier.js';",
      "import { findHiringManager }   from '../emailFinder.js';",
      "import { uscisLookup }         from '../uscis.js';",
      "import { db }                  from '../db/index.js';",
      "import { sendMatchAlerts }     from '../alerts.js';",
      "",
      "async function runFetchCycle() {",
      "  const started = Date.now();",
      "  console.log('[FETCH] Cycle started:', new Date().toISOString());",
      "",
      "  // 1. Fetch all sources in parallel",
      "  const [jsearchRaw, usaRaw, idealistRaw] = await Promise.all([",
      "    Promise.allSettled(QUERIES.map(q => fetchJSearch(q))),",
      "    fetchUSAJobs(),",
      "    fetchIdealist(),",
      "  ]);",
      "",
      "  const allJobs = [",
      "    ...jsearchRaw.flatMap(r => r.status==='fulfilled' ? r.value : []),",
      "    ...usaRaw, ...idealistRaw",
      "  ];",
      "  console.log(`[FETCH] Raw jobs: ${allJobs.length}`);",
      "",
      "  // 2. Process each job",
      "  let inserted=0, skipped=0, discarded=0;",
      "  for (const job of allJobs) {",
      "    // Check for existing by job_id",
      "    const exists = await db.job.findUnique({ where: { job_id: job.job_id }});",
      "    if (exists) { skipped++; continue; }",
      "",
      "    // Classify visa eligibility",
      "    const uscisMatch = await uscisLookup(job.company_name);",
      "    const classification = classifyJob(job, uscisMatch);",
      "    if (classification.discard) { discarded++; continue; }",
      "",
      "    // Find hiring manager email via Apollo.io",
      "    const contact = await findHiringManager(job.company_name);",
      "",
      "    // Store to DB",
      "    await db.job.create({ data: { ...job, ...classification, ...contact }});",
      "    inserted++;",
      "  }",
      "",
      "  // 3. Clean expired listings",
      "  const expired = await db.job.deleteMany({",
      "    where: { expires_at: { lt: new Date() }}",
      "  });",
      "",
      "  // 4. Send client alerts",
      "  await sendMatchAlerts();",
      "",
      "  console.log(`[FETCH] Done in ${Date.now()-started}ms. Inserted:${inserted} Skipped:${skipped} Discarded:${discarded} Expired:${expired.count}`);",
      "}",
      "",
      "runFetchCycle().catch(err => {",
      "  console.error('[FETCH] CRITICAL ERROR:', err);",
      "  process.exit(1);",
      "});",
    ]}/>
  </div>;
}

      "export async function findHiringManager(companyName) {",
      "  try {",
      "    const domain = await companyToDomain(companyName);",

      "    const res = await fetch('https://api.apollo.io/v1/people/search', {",
      "      method: 'POST',",
      "      headers: {",
      "        'x-api-key':     process.env.APOLLO_API_KEY,",

      "      }),",
      "    });",
      "",
      "    const { people } = await res.json();",
      "    if (!people?.length || !people[0].email) return null;",
      "",
      "    const p = people[0];",
      "    // Only store verified emails — discard risky/invalid",
      "    if (p.email_status === 'invalid') return null;",

function AuthSec(){
  return <div>
    <SH n="17">Auth & Zero Trust</SH>
    <Blk type="security">Zero Trust principle: Never trust, always verify. Every request must prove identity — internal services, admin users, and API clients are all treated as untrusted by default.</Blk>
    <H3>JWT Implementation</H3>
    <Code lang="javascript — auth/jwt.js" lines={[
      "import jwt from 'jsonwebtoken';",
      "import { randomBytes } from 'crypto';",
      "",
      "const ACCESS_EXPIRY  = '15m';   // Short-lived — reduces theft window",
      "const REFRESH_EXPIRY = '7d';    // Longer — rotated on each use",
      "",
      "export const signAccessToken = (payload) =>",
      "  jwt.sign(payload, process.env.JWT_ACCESS_SECRET, {",
      "    expiresIn:  ACCESS_EXPIRY,",
      "    algorithm:  'RS256',          // RSA — more secure than HS256",
      "    issuer:     'placeupcareer.com',",
      "    audience:   'placeup-api',",
      "  });",
      "",
      "export const signRefreshToken = (userId) => {",
      "  const token = randomBytes(64).toString('hex'); // Cryptographically random",
      "  // Store hash in DB — never store raw token",
      "  const hash = hashToken(token);",
      "  // Save: { userId, tokenHash: hash, expiresAt: 7days }",
      "  return token;",
      "};",
      "",
      "// Verify and rotate refresh token",
      "export const rotateRefreshToken = async (incomingToken) => {",
      "  const hash = hashToken(incomingToken);",
      "  const stored = await db.refreshToken.findUnique({ where: { hash }});",
      "  if (!stored || stored.expiresAt < new Date()) throw new Error('INVALID_TOKEN');",
      "  // Delete old token — issue new one (rotation)",
      "  await db.refreshToken.delete({ where: { hash }});",
      "  return issueNewRefreshToken(stored.userId);",
      "};",
    ]}/>
    <H3>MFA — TOTP Setup</H3>
    <Code lang="javascript — auth/mfa.js" lines={[
      "import speakeasy from 'speakeasy';",
      "import qrcode    from 'qrcode';",
      "",
      "export const setupMFA = async (userId) => {",
      "  const secret = speakeasy.generateSecret({ length: 32 });",
      "  // Encrypt before storing",
      "  await db.client.update({",
      "    where: { id: userId },",
      "    data:  { mfa_secret: encrypt(secret.base32) }",
      "  });",
      "  const otpUrl = speakeasy.otpauthURL({",
      "    secret: secret.base32,",
      "    label:  'PlaceUp Career',",
      "    issuer: 'PlaceUp Career',",
      "  });",
      "  return qrcode.toDataURL(otpUrl); // Return QR code image",
      "};",
      "",
      "export const verifyMFA = (secret, token) =>",
      "  speakeasy.totp.verify({ secret, encoding: 'base32', token, window: 1 });",
    ]}/>
    <H3>Zero Trust Checklist</H3>
    <DT headers={["Principle","Implementation","Status"]} rows={[
      ["Verify explicitly","Every API request validates JWT signature + expiry","✓ Implemented"],
      ["Least privilege","Each service role has minimum DB permissions","✓ Implemented"],
      ["Assume breach","Audit logs capture all actions — alerts on anomaly","✓ Implemented"],
      ["Micro-segmentation","Services communicate via internal network only","✓ Implemented"],
      ["Device trust","User agent + IP logged — anomaly triggers re-auth","✓ Implemented"],
      ["Continuous validation","Token expiry 15min — forced re-validation","✓ Implemented"],
    ]}/>
  </div>;
}

  </div>;
}

const SECTION_MAP={
  overview:Overview, architecture:Architecture, techstack:TechStack,
  jobtitles:JobTitles, apis:APIsSection, queries:Queries2,
  classifier:Classifier2, scheduler:SchedulerSection, emailfinder:EmailFinderSection,
  database:DatabaseSection, dbsecurity:DBSecurity,
  backend:Backend2, payment:PaymentPortal, microservices:Microservices,
  security:SecurityArch, waf:WAF, authsec:AuthSec, encryption:Encryption, compliance:Compliance,
  frontend:FrontendSection, devops:DevOps, monitoring:Monitoring,
  costs:Costs2, timeline:Timeline2, env:EnvSection,
};

// ══════════════════════════════════════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════════════════════════════════════
function App(){
  const [active,setActive]=useState("overview");
  const [sideOpen,setSideOpen]=useState(true);
  const [search,setSearch]=useState("");
  const contentRef=useRef(null);
  const Section=SECTION_MAP[active]||Overview;
  const activeIdx=ALL_NAV.findIndex(n=>n.id===active);

  useEffect(()=>{if(contentRef.current)contentRef.current.scrollTop=0;},[active]);

  const filteredGroups=search?NAV_GROUPS.map(g=>({...g,items:g.items.filter(i=>i.label.toLowerCase().includes(search.toLowerCase()))})).filter(g=>g.items.length>0):NAV_GROUPS;

  return(
    <div style={{display:"flex",height:"100vh",background:P.bg1,overflow:"hidden"}}>

      {/* ── SIDEBAR ──────────────────────────────────────────────────────────── */}
      <div style={{width:sideOpen?272:0,flexShrink:0,background:P.bg2,borderRight:`1px solid ${P.border}`,display:"flex",flexDirection:"column",transition:"width .25s",overflow:"hidden"}}>
        {/* Logo */}
        <div style={{padding:"20px 18px 14px",borderBottom:`1px solid ${P.borderMid}`,flexShrink:0}}>
          <div style={{fontSize:19,fontWeight:800,color:P.white,fontFamily:"'Syne',sans-serif",whiteSpace:"nowrap"}}>Place<span style={{color:P.gold}}>Up</span> Career</div>
          <div style={{fontSize:9,color:P.muted,marginTop:2,letterSpacing:1,textTransform:"uppercase",whiteSpace:"nowrap"}}>Enterprise Documentation v2.0</div>
        </div>
        {/* Search */}
        <div style={{padding:"10px 12px",borderBottom:`1px solid ${P.borderMid}`,flexShrink:0}}>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search sections..." style={{width:"100%",padding:"7px 11px",background:"rgba(255,255,255,0.04)",border:`1px solid ${P.borderMid}`,borderRadius:7,fontSize:12,color:P.white,outline:"none"}}/>
        </div>
        {/* Nav groups */}
        <nav style={{flex:1,overflowY:"auto",padding:"8px 8px"}}>
          {filteredGroups.map((group,gi)=>(
            <div key={gi} style={{marginBottom:16}}>
              <div style={{fontSize:9,color:P.muted,fontWeight:700,letterSpacing:1.2,textTransform:"uppercase",padding:"4px 10px",marginBottom:3}}>{group.group}</div>
              {group.items.map(item=>(
                <button key={item.id} onClick={()=>{setActive(item.id);setSearch("");}} style={{width:"100%",display:"flex",alignItems:"center",gap:8,padding:"7px 10px",borderRadius:7,border:"none",cursor:"pointer",marginBottom:1,background:active===item.id?"rgba(212,168,67,0.1)":"transparent",transition:"all .15s",textAlign:"left",whiteSpace:"nowrap"}}>
                  <span style={{fontSize:12,color:active===item.id?P.gold:P.muted,flexShrink:0,width:16}}>{item.icon}</span>
                  <span style={{fontSize:12.5,fontWeight:active===item.id?600:400,color:active===item.id?P.white:P.muted,flex:1}}>{item.label}</span>
                  {active===item.id&&<div style={{width:4,height:4,borderRadius:"50%",background:P.gold,flexShrink:0}}/>}
                </button>
              ))}
            </div>
          ))}
        </nav>
        {/* Sidebar footer */}
        <div style={{padding:"10px 18px",borderTop:`1px solid ${P.borderMid}`,flexShrink:0}}>
          <div style={{fontSize:10,color:P.muted}}>v2.0.0 · March 2026 · Enterprise</div>
          <div style={{fontSize:10,color:"rgba(122,143,168,0.5)",marginTop:1}}>Confidential · Internal Use Only</div>
        </div>
      </div>

      {/* ── MAIN CONTENT ──────────────────────────────────────────────────────── */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",minWidth:0}}>
        {/* Top bar */}
        <div style={{height:48,borderBottom:`1px solid ${P.borderMid}`,display:"flex",alignItems:"center",padding:"0 22px",gap:12,flexShrink:0,background:"rgba(10,22,40,0.95)"}}>
          <button onClick={()=>setSideOpen(!sideOpen)} style={{background:"none",border:"none",cursor:"pointer",color:P.muted,fontSize:16,padding:"3px 5px",borderRadius:4,lineHeight:1}}>☰</button>
          <div style={{width:1,height:16,background:"rgba(255,255,255,0.07)"}}/>
          <span style={{fontSize:12,color:P.muted}}>{ALL_NAV.find(n=>n.id===active)?.label}</span>
          <div style={{marginLeft:"auto",display:"flex",gap:5,flexWrap:"wrap"}}>
            <Tag t="free">$15/mo MVP</Tag>
            <Tag t="new">300+ Job Titles</Tag>
            <Tag t="teal">Stripe Payments</Tag>
            <Tag t="best">8-Layer Security</Tag>
          </div>
        </div>

        {/* Content */}
        <div ref={contentRef} style={{flex:1,overflowY:"auto",padding:"30px 44px 60px",maxWidth:960}}>
          <Section/>
          {/* Prev/Next */}
          <div style={{marginTop:40,paddingTop:20,borderTop:`1px solid ${P.borderMid}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            {activeIdx>0&&<button onClick={()=>setActive(ALL_NAV[activeIdx-1].id)} style={{background:"rgba(255,255,255,0.03)",border:`1px solid ${P.borderMid}`,borderRadius:8,padding:"8px 16px",color:P.muted,fontSize:13,cursor:"pointer"}}>← {ALL_NAV[activeIdx-1].label}</button>}
            <div style={{flex:1}}/>
            {activeIdx<ALL_NAV.length-1&&<button onClick={()=>setActive(ALL_NAV[activeIdx+1].id)} style={{background:"rgba(212,168,67,0.08)",border:"1px solid rgba(212,168,67,0.22)",borderRadius:8,padding:"8px 16px",color:P.gold,fontSize:13,cursor:"pointer",fontWeight:600}}>{ALL_NAV[activeIdx+1].label} →</button>}
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
